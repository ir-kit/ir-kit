name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          INTEGRATION_TEST: "true"

      - name: Example drift check
        run: |
          pnpm --filter @ir-kit/example-openapi-sdk-petstore gen
          pnpm --filter @ir-kit/example-asyncapi-events gen
          if ! git diff --exit-code -- examples/openapi-sdk-petstore examples/asyncapi-events/generated; then
            echo "::error::Example outputs drifted from committed copy. Run \`pnpm --filter @ir-kit/example-openapi-sdk-petstore gen && pnpm --filter @ir-kit/example-asyncapi-events gen\` and commit the result."
            exit 1
          fi

  go-lint:
    name: Lint Go compiler snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.38.0

      - name: Lint snapshots
        run: bash scripts/lint-go.sh

      - name: Lint generated example SDK
        run: bash scripts/lint-go.sh examples/openapi-sdk-petstore/go/sdk

      - name: Vet Go SDK runtime
        run: |
          bash scripts/lint-go.sh packages/openapi/go/runtime
          (cd packages/openapi/go/runtime && go vet ./...)

  kotlin-lint:
    name: Lint Kotlin compiler snapshots and generated SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Lint snapshots
        run: bash scripts/lint-kotlin.sh

      - name: Lint openapi-kotlin runtime
        run: bash scripts/lint-kotlin.sh packages/openapi/kotlin/runtime

      - name: Lint generated example SDK
        run: bash scripts/lint-kotlin.sh examples/openapi-sdk-petstore/kotlin/sdk

  swift-lint:
    name: Lint Swift compiler snapshots and generated SDK
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Lint snapshots
        run: bash scripts/lint-swift.sh

      - name: Lint generated example SDK
        run: bash scripts/lint-swift.sh examples/openapi-sdk-petstore/swift/sdk
