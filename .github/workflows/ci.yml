name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Check published entry points load under Node
        run: pnpm check:exports

      - name: Test
        run: pnpm test
        env:
          INTEGRATION_TEST: "true"

      - name: Example is up to date and typechecks
        run: pnpm --filter @ir-kit/example-petstore check

  smoke:
    name: Install the packed package in an empty folder and run every command
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack ir-kit
        run: pnpm build && pnpm --filter ir-kit pack --pack-destination "$RUNNER_TEMP"

      # Java, Kotlin and Swift output is already linted and built by the jobs below.
      - name: Smoke test
        run: SMOKE_LANGS="" bash scripts/smoke-published.sh "$RUNNER_TEMP"/ir-kit-*.tgz

  go-lint:
    name: Lint Go compiler snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.38.0

      - name: Lint snapshots
        run: bash scripts/lint-go.sh

      - name: Lint generated example SDK
        run: bash scripts/lint-go.sh examples/petstore/go/sdk

      - name: Vet Go SDK runtime
        run: |
          bash scripts/lint-go.sh packages/ir-kit/runtime/go
          (cd packages/ir-kit/runtime/go && go vet ./...)

  kotlin-lint:
    name: Lint Kotlin compiler snapshots and generated SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/

      - name: Lint snapshots
        run: bash scripts/lint-kotlin.sh

      - name: Lint openapi-kotlin runtime
        run: bash scripts/lint-kotlin.sh packages/ir-kit/runtime/kotlin

      - name: Lint generated example SDK
        run: bash scripts/lint-kotlin.sh examples/petstore/kotlin/sdk

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build generated example SDK
        run: bash scripts/build-kotlin.sh examples/petstore/kotlin/sdk

  swift-lint:
    name: Lint Swift compiler snapshots and generated SDK
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Lint snapshots
        run: bash scripts/lint-swift.sh

      - name: Lint generated example SDK
        run: bash scripts/lint-swift.sh examples/petstore/swift/sdk

      - name: Build generated example SDK
        working-directory: examples/petstore/swift/sdk
        run: swift build

  lint-java:
    name: Lint generated Java SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lint generated example SDK
        run: bash scripts/lint-java.sh examples/petstore/java/sdk

      - name: Lint SDK runtime
        run: bash scripts/lint-java.sh packages/ir-kit/runtime/java
