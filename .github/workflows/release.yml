name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; `pnpm publish` delegates to it.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The pre-push typecheck needs built packages; the release PR's own CI checks it.
          LEFTHOOK: "0"
          # Only for publishing a package's first version; npm trusted
          # publishing (OIDC) is used whenever this secret is unset.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Smoke test the published package
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=$(jq -r '.[] | select(.name == "@ir-kit/kit") | .version' <<<"$PUBLISHED")
          [ -n "$version" ] || exit 0
          SMOKE_LANGS="" bash scripts/smoke-published.sh "@ir-kit/kit@$version"
